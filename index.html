<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2D shooter</title>
  <style>
    html, body { margin: 0; overflow: hidden; background: #111; }
    canvas { display: block; background: #222; }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="1980" height="1080"></canvas>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let keys = {};
let mouse = { x: 0, y: 0, down: false };

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);
canvas.addEventListener("mousedown", () => mouse.down = true);
canvas.addEventListener("mouseup", () => mouse.down = false);
canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

// Player
const player = {
  x: 100, y: 100, size: 30, speed: 4,
  bullets: [], fireRate: 300, lastFired: 0, hp: 5,
};

// Game loop
function gameLoop(timestamp) {
  update(timestamp);
  draw();
  requestAnimationFrame(gameLoop);
}

function update(timestamp) {
  // Move player
  if (keys["ArrowUp"] || keys["w"]) player.y -= player.speed;
  if (keys["ArrowDown"] || keys["s"]) player.y += player.speed;
  if (keys["ArrowLeft"] || keys["a"]) player.x -= player.speed;
  if (keys["ArrowRight"] || keys["d"]) player.x += player.speed;

  // Place block
  if (mouse.down && timestamp - player.lastPlaced > player.fireRate) {
    const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    player.block.push({
      x: player.x, y: player.y,
      vx: Math.cos(angle) * 7,
      vy: Math.sin(angle) * 7,
      size: 5
    });
    player.lastPlaced = timestamp;
  }

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw player
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2);
  ctx.fill();
  
  // HUD
  ctx.fillStyle = "#fff";
  ctx.font = "20px Arial";
  ctx.fillText("HP: " + player.hp, 20, 30);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
